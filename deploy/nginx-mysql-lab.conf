# deploy/nginx-mysql-lab.conf — HTTPS 前置 Nginx 模板（v1.0.3）
#
# 用法：cp 到 /etc/nginx/conf.d/mysql-lab.conf，把 <域名> 全部替换后
#   nginx -t && systemctl enable --now nginx
# 证书先用 certbot --nginx 自动签（流程见 docs/部署说明.md 第九节），
# 本模板假设证书已就位；没有证书时 nginx -t 会报错，属预期。
#
# 两个必须理解的边界：
# 1. HTTPS 只保护 Web 面板（8000→443）。学生的 33001-33100 是 MySQL 协议，
#    Navicat 直连，**不过 Nginx**——别试图在这里 proxy_pass 它们，Nginx 说不了 MySQL 话。
#    学生实例通道的安全靠的是：库级账号授权 + 密码随机 + 容器 cap 收敛（见交付说明书第三节）。
# 2. 启用本配置后必须把 uvicorn 收回 127.0.0.1（第九节第 5 步），
#    否则任何人绕过 443 直连 8000，TLS 和 XFF 防伪造全部白做。

server {
    listen 80;
    listen [::]:80;
    server_name <域名>;

    # certbot 续期要用 80 端口应答，跳转规则给它留活路
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <域名>;

    # certbot --nginx 会自动改写下面两行路径；手工续期后 reload nginx 即可
    ssl_certificate     /etc/letsencrypt/live/<域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<域名>/privkey.pem;

    # 教学平台，TLS 版本收到现代区间即可；学生用 Navicat 连的是 33001 段，不受这里影响
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MySQLLab:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # 这两行是登录限流「取真实 IP」的依据：应用侧 LAB_TRUST_PROXY=true 时才会信它们。
        # 必须成对出现——只开一头等于限流形同虚设或全班被记成同一个 IP。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 开课轮询接口是 2s 一次的短请求，不缓存；凭据 CSV 更不能缓存
        proxy_buffering off;
    }
}
